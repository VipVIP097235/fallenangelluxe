<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FallenAngelluxe | Official Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* BACKGROUND IMAGE WITH DARK OVERLAY TINT */
      background: linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.85)), 
                  url('luxe-laying-down.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #e2e2e8;
      font-family: 'Poppins', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    h1, h2 {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    /* Profile Header Card */
    .profile-card {
      text-align: center;
      background: rgba(14, 12, 20, 0.75);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.4); /* GOLD OUTLINE */
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); /* SOFT GOLD GLOW */
    }

    .profile-card h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .profile-card p {
      font-size: 0.95rem;
      color: #a0a0b0;
      margin-bottom: 25px;
    }

    /* Social Links - Solid White Buttons */
    .link-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: #ffffff !important; /* Solid White */
      color: #08080c !important; /* Dark text */
      border: 1px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #f0f0f5 !important;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
    }

    .btn-discord {
      background: #ffffff !important;
    }

    /* Countdown Card */
    .countdown-card {
      background: rgba(13, 9, 18, 0.8);
      backdrop-filter: blur(10px);
      padding: 28px 20px;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.4); /* GOLD OUTLINE */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .countdown-card h2 {
      font-size: 1.3rem;
      color: #d4af37; /* GOLD TITLE */
      margin-bottom: 6px;
    }

    .countdown-card p {
      font-size: 0.88rem;
      color: #c0a0a0;
      margin-bottom: 20px;
    }

    /* Countdown Numbers Grid */
    .timer-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .time-box {
      background: rgba(8, 8, 12, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.5); /* GOLD OUTLINE */
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 65px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .time-box span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); /* GOLD TEXT GLOW */
    }

    .time-box label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #808090;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #808090;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 🪽 BRAND / PROFILE HEADER -->
    <header class="profile-card">
      <h1>FALLENANGELLUXE</h1>
      <p>A new era begins. 🪽🖤</p>

      <!-- OFFICIAL SOCIAL LINKS -->
      <div class="link-group">
        <a href="https://discord.com/invite/UJ5KxgH4br" target="_blank" class="btn btn-discord">🪽 Join the Sanctuary Discord</a>
        <a href="https://www.tiktok.com/@fallenangelluxe" target="_blank" class="btn btn-tiktok">🖤 TikTok (@fallenangelluxe)</a>
        <a href="https://www.youtube.com/@fallenangelluxe" target="_blank" class="btn btn-youtube">📺 YouTube (@fallenangelluxe)</a>
        <a href="https://x.com/fallenangelluxe" target="_blank" class="btn btn-x">✖️ X / Twitter (@fallenangelluxe)</a>
      </div>
    </header>

    <!-- ⏳ COUNTDOWN SECTION -->
    <section class="countdown-card">
      <h2>⏳ Official Launch Countdown</h2>
      <p>The gates open soon...</p>

      <div class="timer-grid">
        <div class="time-box">
          <span id="days">00</span>
          <label>Days</label>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <label>Hours</label>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <label>Mins</label>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <label>Secs</label>
        </div>
      </div>
    </section>

    <footer>
      © FallenAngelluxe • All Rights Reserved
    </footer>

  </div>

  <!-- LIVE COUNTDOWN SCRIPT -->
  <script>
    // TARGET LAUNCH DATE: AUGUST 6, 2026
    const launchDate = new Date("2026/08/06 00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = launchDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days < 10 ? "0" + days : days;
        document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
      } else {
        document.querySelector(".countdown-card p").innerText = "The new era has arrived!";
        document.querySelector(".timer-grid").innerHTML = "<h3 style='color:#d4af37; font-family:Cinzel;'>NOW LIVE</h3>";
      }
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
