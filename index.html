<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FallenAngelluxe | Official Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(5, 5, 8, 0.7), rgba(5, 5, 8, 0.9)), 
                  url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #e2e2e8;
      font-family: 'Poppins', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 🎬 1. INTRO SCREEN STYLES */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #030305;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #enter-btn {
      background: transparent;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.6);
      padding: 18px 35px;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(5px);
    }

    #enter-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.5);
      transform: scale(1.05);
      color: #fff;
      border-color: #d4af37;
    }

    /* 👼 2. ANGEL TRANSITION SCREEN */
    #angel-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #030305;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998; /* Under the button screen, over the website */
      transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
    }

    #angel-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* This adds a slow zoom effect to the angels while they are on screen */
    #angel-image {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
      animation: slowZoom 5s ease-in-out;
    }

    @keyframes slowZoom {
      0% { transform: scale(0.95); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: scale(1.05); }
    }

    /* 📦 3. MAIN CONTENT CONTAINER */
    #main-content {
      width: 100%;
      max-width: 600px;
      display: none; /* Hidden on load */
      flex-direction: column;
      gap: 20px;
      padding: 30px 20px;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }

    #main-content.visible {
      display: flex;
      opacity: 1;
    }

    h1, h2, h3 {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    /* 🗂️ TAB NAVIGATION */
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      background: rgba(14, 12, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #a0a0b0;
      padding: 12px 15px;
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .tab-btn:hover {
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
    }

    .tab-btn.active {
      background: rgba(212, 175, 55, 0.15);
      color: #d4af37;
      border-color: #d4af37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .tab-content.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Lore Styles */
    .card {
      background: rgba(14, 12, 20, 0.75);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
      text-align: center;
    }

    .card h1 { font-size: 2rem; color: #ffffff; margin-bottom: 8px; }
    .card h2 { font-size: 1.5rem; color: #d4af37; margin-bottom: 4px; }
    .card p { font-size: 0.95rem; color: #a0a0b0; }

    .subtitle {
      font-size: 0.78rem;
      color: #d4af37;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- 🎬 1. THE INTRO SCREEN -->
  <div id="intro-screen">
    <button id="enter-btn">Let's go for an adventure ✨</button>
  </div>

  <!-- 👼 2. THE ANGEL TRANSITION SCREEN -->
  <div id="angel-screen" class="hidden">
    <!-- !!! SWAP THE SRC LINK BELOW WITH YOUR ANGEL PICTURE !!! -->
    <img id="angel-image" src="https://images.unsplash.com/photo-1601662528567-526cd06f6582?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Angels">
  </div>

  <!-- 📦 3. THE MAIN WEBSITE CONTENT -->
  <div id="main-content">
    <div class="tabs">
      <button class="tab-btn active" onclick="openTab(event, 'home-tab')">☀️ Home</button>
      <button class="tab-btn" onclick="openTab(event, 'links-tab')">🔗 Links</button>
      <button class="tab-btn" onclick="openTab(event, 'support-tab')">🌻 Light in the Dark</button>
    </div>

    <!-- TAB 1: HOME -->
    <div id="home-tab" class="tab-content active">
      <header class="card">
        <h1>FALLENANGELLUXE</h1>
        <p>A new era begins. 🪽🖤</p>
      </header>
    </div>

    <!-- TAB 2: LINKS -->
    <div id="links-tab" class="tab-content">
      <section class="card">
        <h2>🔗 Connect & Join</h2>
        <div class="subtitle">Step Into The Sanctuary</div>
        <p>Links go here.</p>
      </section>
    </div>

    <!-- TAB 3: SUPPORT -->
    <div id="support-tab" class="tab-content">
      <section class="card">
        <h2>🌻 Light in the Dark</h2>
        <div class="subtitle">Support & Resources</div>
        <p>Resources go here.</p>
      </section>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script>
    // 🎬 CINEMATIC SEQUENCE LOGIC
    document.getElementById('enter-btn').addEventListener('click', function() {
      const introScreen = document.getElementById('intro-screen');
      const angelScreen = document.getElementById('angel-screen');
      const mainContent = document.getElementById('main-content');
      
      // Step 1: Fade out the black background and button
      introScreen.classList.add('hidden');
      
      setTimeout(() => {
        // Remove button screen completely
        introScreen.style.display = 'none';
        
        // Step 2: Show the Angel image
        angelScreen.classList.remove('hidden');

        // Let the angel image stay on screen for 3.5 seconds
        setTimeout(() => {
          
          // Step 3: Fade out the Angels
          angelScreen.classList.add('hidden');

          setTimeout(() => {
            // Remove Angel screen completely
            angelScreen.style.display = 'none';

            // Step 4: Fade in the Main Website Content
            mainContent.style.display = 'flex';
            setTimeout(() => {
              mainContent.classList.add('visible');
            }, 50); 
            
          }, 1500); // Waits for the angels to finish fading out

        }, 3500); // 3.5 seconds of viewing the angels

      }, 1000); // Waits for the button screen to finish fading out
    });

    // 🗂️ TAB SWITCHING SCRIPT
    function openTab(evt, tabId) {
      let contents = document.getElementsByClassName("tab-content");
      for (let i = 0; i < contents.length; i++) {
        contents[i].classList.remove("active");
      }
      let buttons = document.getElementsByClassName("tab-btn");
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
      document.getElementById(tabId).classList.add("active");
      evt.currentTarget.classList.add("active");
    }
  </script>

</body>
</html>
