<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FallenAngelluxe | Official Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      color: #e2e2e8;
      font-family: 'Poppins', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    h1, h2 {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    /* Profile Header Card */
    .profile-card {
      text-align: center;
      background: linear-gradient(180deg, #0e0c14 0%, #050508 100%);
      padding: 35px 25px;
      border-radius: 24px;
      border: 1px solid rgba(138, 3, 3, 0.25);
      box-shadow: 0 0 30px rgba(138, 3, 3, 0.15);
    }

    .avatar-glow {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #8a0303;
      box-shadow: 0 0 25px rgba(138, 3, 3, 0.6);
      margin-bottom: 18px;
    }

    .profile-card h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .profile-card p {
      font-size: 0.95rem;
      color: #a0a0b0;
      margin-bottom: 25px;
    }

    /* Social Links */
    .link-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #10101a;
      color: #ffffff;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-discord {
      background: linear-gradient(135deg, #5865F2, #3b47c2);
      border: none;
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
    }

    .btn-discord:hover {
      box-shadow: 0 0 30px rgba(88, 101, 242, 0.7);
    }

    .btn-tiktok:hover {
      border-color: #ff0050;
      box-shadow: 0 0 18px rgba(255, 0, 80, 0.35);
    }

    .btn-youtube:hover {
      border-color: #ff0000;
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.35);
    }

    .btn-x:hover {
      border-color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    }

    /* Dark Teaser Section */
    .teaser-card {
      background: linear-gradient(180deg, #0d0912 0%, #140508 100%);
      padding: 25px;
      border-radius: 24px;
      border: 1px solid rgba(138, 3, 3, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .teaser-card h2 {
      font-size: 1.3rem;
      color: #ff4d4d;
      margin-bottom: 8px;
    }

    .teaser-card p {
      font-size: 0.88rem;
      color: #c0a0a0;
      margin-bottom: 15px;
    }

    .video-container {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #505060;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 🪽 BRAND / PROFILE HEADER -->
    <header class="profile-card">
      <!-- REPLACE WITH YOUR NEW PROFILE PICTURE URL -->
      <img src="https://via.placeholder.com/150" alt="FallenAngelluxe" class="avatar-glow">
      <h1>FallenAngelluxe</h1>
      <p>A new era begins. 🪽🖤</p>

      <!-- OFFICIAL SOCIAL LINKS -->
      <div class="link-group">
        <a href="https://discord.com/invite/UJ5KxgH4br" target="_blank" class="btn btn-discord">🪽 Join the Sanctuary Discord</a>
        <a href="https://www.tiktok.com/@fallenangelluxe" target="_blank" class="btn btn-tiktok">🖤 TikTok (@fallenangelluxe)</a>
        <a href="https://www.youtube.com/@fallenangelluxe" target="_blank" class="btn btn-youtube">📺 YouTube (@fallenangelluxe)</a>
        <a href="https://x.com/fallenangelluxe" target="_blank" class="btn btn-x">✖️ X / Twitter (@fallenangelluxe)</a>
      </div>
    </header>

    <!-- 🥀 OFFICIAL FIRST TEASER -->
    <section class="teaser-card">
      <h2>🥀 Official Teaser</h2>
      <p>Something dark is rising...</p>

      <div class="video-container">
        <!-- TEASER VIDEO FILE -->
        <video controls autoplay muted loop>
          <source src="teaser2.mp4" type="video/mp4">
          Your browser does not support video.
        </video>
      </div>
    </section>

    <footer>
      © FallenAngelluxe • All Rights Reserved
    </footer>

  </div>

</body>
</html>
